server:
  tomcat:
    accept-count: 1024
    max-connections: 8192
    threads:
      min-spare: 100
      max: 200

spring:
  application:
    name: envio-oauth

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  web:
    resources:
      add-mappings: false

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DBNAME}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1740000
      keepalive-time: 120000
      auto-commit: false

  data:
    redis:
      client-type: lettuce
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            redirect-uri: ${GITHUB_WEB_REDIRECT_URI:http://localhost:8080/api/auth/oauth/github/callback}
            scope:
              - read:user
              - user:email

  sql:
    init:
      mode: always
      schema-locations: classpath:init.sql
      continue-on-error: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        use_sql_comments: false
        criteria:
          literal_handling_mode: bind
        query:
          in_clause_parameter_padding: true
        connection:
          provider_disables_autocommit: true
    defer-datasource-initialization: false
    open-in-view: false

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health, info

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173

auth:
  oauth2:
    authorization-base-uri: /api/auth/oauth
    redirection-base-uri: /api/auth/oauth/*/callback
    frontend-redirect-uri: ${OAUTH_FRONTEND_REDIRECT_URI:http://localhost:5173/auth/callback}
    cli-redirect-uri: ${GITHUB_CLI_REDIRECT_URI:http://localhost:8080/api/auth/cli/login/github/redirect}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:30m}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}

springdoc:
  swagger-ui:
    display-request-duration: true
    operations-sorter: alpha
    try-it-out-enabled: true
    tags-sorter: alpha
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
