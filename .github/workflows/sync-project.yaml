name: Sync GitLab project (OAuth)

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLAB_TARGET_BRANCH: auth
  SYNC_SOURCE_PATH: OAuth

jobs:
  sync-to-gitlab:
    name: Push OAuth snapshot to GitLab
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push OAuth folder to GitLab auth branch
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TARGET_TOKEN_NAME: ${{ secrets.TARGET_TOKEN_NAME }}
          TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gitlab_remote_path="${TARGET_URL#https://}"
          gitlab_remote_path="${gitlab_remote_path#http://}"
          gitlab_remote_path="${gitlab_remote_path%/}"

          if [ ! -d "${SYNC_SOURCE_PATH}" ]; then
            echo "::error::SYNC_SOURCE_PATH '${SYNC_SOURCE_PATH}' does not exist."
            exit 1
          fi

          subtree_ref="$(git subtree split --prefix="${SYNC_SOURCE_PATH}" HEAD | tail -n 1)"
          git rev-parse --verify "${subtree_ref}^{commit}" >/dev/null

          git remote add gitlab "https://${TARGET_TOKEN_NAME}:${TARGET_TOKEN}@${gitlab_remote_path}"
          git push --force gitlab "${subtree_ref}:refs/heads/${GITLAB_TARGET_BRANCH}"
